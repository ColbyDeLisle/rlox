name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Lint
        run: cargo check

      - name: Lint (Clippy)
        run: cargo clippy

      - name: Install Dart 2.19
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '2.19.6'

      - name: Get Dart dependencies
        working-directory: tests/craftinginterpreters/tool
        run: dart pub get

      - name: Test jlox
        working-directory: tests/craftinginterpreters
        run: dart run tool/bin/test.dart jlox --interpreter $GITHUB_WORKSPACE/target/release/rlox
