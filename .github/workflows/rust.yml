name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install Dart (Linux)
      - name: Install Dart 2.19
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https
          sudo sh -c 'wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -'
          sudo sh -c 'wget -qO- https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list > /etc/apt/sources.list.d/dart_stable.list'
          sudo apt-get update
          sudo apt-get install -y dart=2.19.*

      - name: Build
        run: cargo build --release

      - name: Clone test suite
        run: git clone https://github.com/munificent/craftinginterpreters.git

      - name: Get Dart dependencies
        working-directory: craftinginterpreters/tool
        run: dart pub get

      - name: Test
        working-directory: craftinginterpreters
        run: dart run tool/bin/test.dart jlox $GITHUB_WORKSPACE/target/release/rlox
